# .only-local: &only-local
#   only:
#     - master
#     - devel
#     - merge_request
    
# .only-remote: &only-remote
#   except:
#     - master
#     - devel

.only-all: &only-all
  only:
    - branches
    - merge_requests
    
  except:
    refs:
      - master
      - devel


.only-merge-requests: &only-merge-requests
  only:
    - merge_requests
  except:
    changes:
      - /*.txt
      - /*.md
      - ug/*

        

#### build_shated and test_shared will be executed when someone is working on 
#### their own branch, before performing a merge request. This build and
#### and test is just a simple evaluation that the changes doesn't break the 
#### multi-core build, and a simple CPU simulation can be executed.
#### Whenever a merge request is submitted, the local builds and tests are 
#### executed, exercising more code paths and simulations modalities. This way
#### people can push as much as they want without filling our local queu.

