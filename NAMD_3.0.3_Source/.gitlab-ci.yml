test_multicore_gaza:
   # execute this job always, no matter if it is a push or a merge request
  <<: *only-all
  stage: test
  tags:
    # If you don't place the tag here, it will run on a shared runner
    - gazaACB_namd
    
  script:
    - echo "test"
    - cd Linux-x86_64-g++
    - ./namd3 +p8 src/alanin > alanin_multicore.log
  dependencies:
    - build_multicore_gaza
  artifacts:
    paths:
      - Linux-x86_64-g++
      
