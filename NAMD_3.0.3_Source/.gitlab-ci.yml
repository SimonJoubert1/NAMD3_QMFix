build_multicore_gaza:
   # execute this job always, no matter if it is a push or a merge request
   # This needs to be on top of everything   
  <<: *only-all
  stage: build

  tags:
   # this is the name of the runner. Don't forget to add the builds_dir = "/ssd2/jribeiro/gitlabrunner/"
   # to the ~/.gitlab-runner/config.toml file
   - gazaACB_namd
  # instead of calling g++ directly you can also use some build toolkit like make
  # install the necessary build tools when needed
  before_script:

    - export LD_LIBRARY_PATH=/usr/lib64:/usr/lib:$LD_LIBRARY_PATH
    - export TCLDIR=/home/tcbdevel/runner/tcl/tcl8.6.13-linux-x86_64-threaded
    - export CHRMDIR=/home/tcbdevel/runner/charm-v7.0.0
    - export FFTWDIR=/home/tcbdevel/runner/fftw/linux-x86_64
  script:
    - echo "after script"
    - ./config Linux-x86_64-g++ --tcl-prefix $TCLDIR --charm-base $CHRMDIR --fftw-prefix ${FFTWDIR}
    - cd Linux-x86_64-g++
    - make -j8

    
  artifacts:
    paths:
      - Linux-x86_64-g++

